name: 月次メンテナンス（リンク死活チェック）

on:
  schedule:
    # 毎月1日 00:00 UTC = 09:00 JST
    - cron: '0 0 1 * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 商品リンクの死活チェック
        id: check
        run: node .github/scripts/check-links.mjs

      - name: メンテナンスログ更新
        if: always()
        run: |
          if [ -f maintenance-report.md ]; then
            DATE=$(date -u -d '+9 hours' +'%Y-%m-%d')
            echo "" >> MAINTENANCE_LOG.md
            echo "## $DATE 自動チェック" >> MAINTENANCE_LOG.md
            echo "" >> MAINTENANCE_LOG.md
            cat maintenance-report.md >> MAINTENANCE_LOG.md
            echo "" >> MAINTENANCE_LOG.md
            echo "---" >> MAINTENANCE_LOG.md
          fi

      - name: ログをコミット
        if: always()
        run: |
          if [ -n "$(git status --porcelain MAINTENANCE_LOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add MAINTENANCE_LOG.md
            git commit -m "chore: 月次メンテナンスログ更新 ($(date -u -d '+9 hours' +'%Y-%m-%d'))"
            git push
          fi

      - name: 問題がある場合はIssueを作成
        if: steps.check.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "${{ steps.check.outputs.issue_title }}" \
            --body-file maintenance-report.md \
            --label "maintenance" || \
          gh issue create \
            --title "${{ steps.check.outputs.issue_title }}" \
            --body-file maintenance-report.md

      - name: サマリー出力
        if: always()
        run: |
          echo "## 📊 月次メンテナンスサマリー" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f maintenance-report.md ]; then
            cat maintenance-report.md >> $GITHUB_STEP_SUMMARY
          fi
