<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品追加 | 命名書ずかん 管理</title>
  <style>
    :root {
      --bg: #FAFAF7;
      --surface: #FFFFFF;
      --border: #EDE9E3;
      --text: #2C2825;
      --sub: #8A8078;
      --accent: #C9A882;
      --accent-dark: #A8895F;
      --accent-light: #F5EDE3;
      --red: #e05555;
      --green: #4caf50;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; background: var(--bg); color: var(--text); }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 16px; font-weight: 700; color: var(--accent-dark); text-decoration: none; }
    .back-link { font-size: 13px; color: var(--sub); text-decoration: none; }
    .back-link:hover { color: var(--accent-dark); }

    .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }

    h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
    h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--accent-dark); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    /* URL入力エリア */
    .url-row { display: flex; gap: 10px; }
    .url-row input { flex: 1; }
    .shop-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
    }
    .badge-rakuten { background: #BF0000; color: #fff; }
    .badge-amazon  { background: #FF9900; color: #fff; }
    .badge-creema  { background: #e8654a; color: #fff; }
    .badge-minne   { background: #e05e99; color: #fff; }
    .badge-unknown { background: #aaa; color: #fff; }

    /* フォーム */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }

    label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
    input[type="text"], input[type="number"], input[type="url"], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; }
    textarea { resize: vertical; min-height: 56px; }

    /* 画像プレビュー */
    .img-preview-wrap { display: flex; gap: 12px; align-items: flex-start; }
    .img-preview-wrap input { flex: 1; }
    .img-thumb {
      width: 60px; height: 60px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--accent-light);
      flex-shrink: 0;
    }

    /* ボタン */
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent-dark); color: #fff; }
    .btn-fetch   { background: var(--accent); color: #fff; white-space: nowrap; }
    .btn-danger  { background: var(--red); color: #fff; font-size: 12px; padding: 6px 12px; }
    .btn-clear   { background: var(--border); color: var(--sub); font-size: 13px; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }

    /* ステータスメッセージ */
    .status {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }
    .status.ok  { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .status.err { display: block; background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .status.info{ display: block; background: var(--accent-light); color: var(--accent-dark); border: 1px solid var(--accent); }

    /* 登録済みリスト */
    .product-list { display: flex; flex-direction: column; gap: 12px; }
    .product-item {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .product-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); background: var(--accent-light); flex-shrink: 0; }
    .product-item-info { flex: 1; min-width: 0; }
    .product-item-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-item-meta { font-size: 12px; color: var(--sub); margin-top: 3px; }
    .empty-list { text-align: center; color: var(--sub); font-size: 14px; padding: 24px 0; }

    /* ローディングスピナー */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <a class="logo" href="#">⚙ 命名書ずかん 管理</a>
  <a class="back-link" href="index.html">← サイトに戻る</a>
</header>

<div class="container">

  <!-- URL入力 -->
  <div class="card">
    <h3>① アフィリエイトリンクを貼り付ける</h3>
    <div class="url-row">
      <input type="url" id="urlInput" placeholder="https://item.rakuten.co.jp/... または Amazon/Creema/minne のURL">
      <button class="btn btn-fetch" id="fetchBtn" onclick="handleFetch()">情報取得</button>
    </div>
    <div id="fetchStatus" class="status"></div>
  </div>

  <!-- 入力フォーム -->
  <div class="card">
    <h3>② 商品情報を入力 <span id="shopBadge"></span></h3>

    <div class="form-grid">
      <div class="full">
        <label>商品名 *</label>
        <input type="text" id="f_name" placeholder="命名書 ○○デザイン ...">
      </div>

      <div>
        <label>価格（円）*</label>
        <input type="number" id="f_price" placeholder="980">
      </div>

      <div>
        <label>ショップ *</label>
        <select id="f_shop">
          <option value="楽天">楽天</option>
          <option value="Amazon">Amazon</option>
          <option value="Creema">Creema</option>
          <option value="minne">minne</option>
        </select>
      </div>

      <div>
        <label>スタイル</label>
        <select id="f_style">
          <option value="洋風">洋風</option>
          <option value="和風">和風</option>
          <option value="モダン">モダン</option>
          <option value="ナチュラル">ナチュラル</option>
        </select>
      </div>

      <div>
        <label>形式</label>
        <select id="f_type">
          <option value="印刷">印刷</option>
          <option value="手書き">手書き</option>
          <option value="デジタル">デジタル</option>
        </select>
      </div>

      <div>
        <label>評価（例: 4.8）</label>
        <input type="number" id="f_rating" placeholder="4.8" step="0.1" min="0" max="5">
      </div>

      <div>
        <label>レビュー数</label>
        <input type="number" id="f_reviewCount" placeholder="120">
      </div>

      <div>
        <label>納期</label>
        <input type="text" id="f_delivery" placeholder="〜3日">
      </div>

      <div>
        <label>タグ（カンマ区切り）</label>
        <input type="text" id="f_tags" placeholder="手書き, 額縁付き">
      </div>

      <div class="full">
        <label>商品画像URL</label>
        <div class="img-preview-wrap">
          <input type="url" id="f_image" placeholder="https://..." oninput="previewImg(this.value)">
          <img class="img-thumb" id="imgThumb" src="" alt="" onerror="this.onerror=null;this.src=''">
        </div>
      </div>

      <div class="full">
        <label>アフィリエイトURL（リンク先）*</label>
        <input type="url" id="f_url" placeholder="https://...">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="addProduct()">＋ 商品を追加</button>
      <button class="btn btn-clear" onclick="clearForm()">クリア</button>
    </div>
    <div id="addStatus" class="status"></div>
  </div>

  <!-- 登録済み商品 -->
  <div class="card">
    <h3>③ 手動追加済み商品 <span id="manualCount" style="color:var(--sub);font-weight:400;font-size:13px;"></span></h3>
    <div class="product-list" id="productList">
      <div class="empty-list">まだ手動追加した商品はありません</div>
    </div>
  </div>

</div>

<script>
const RAKUTEN_APP_ID = 'b1990933-1640-4544-8047-be6b8c3be191';
const STORAGE_KEY = 'meimei_manual_products';

// =====================
// URL解析・自動取得
// =====================
function detectShop(url) {
  if (/amazon\.co\.jp|amzn\.to/.test(url)) return 'Amazon';
  if (/rakuten\.co\.jp|rakuten\.com/.test(url)) return '楽天';
  if (/moshimo\.com/.test(url)) {
    // もしもAFのURL内にrakutenが含まれているか確認
    const decoded = decodeURIComponent(url);
    if (/rakuten/.test(decoded)) return '楽天';
    if (/amazon/.test(decoded)) return 'Amazon';
    if (/creema/.test(decoded)) return 'Creema';
    if (/minne/.test(decoded)) return 'minne';
    return '楽天'; // デフォルト
  }
  if (/creema\.jp/.test(url)) return 'Creema';
  if (/minne\.com/.test(url)) return 'minne';
  return null;
}

function extractRakutenItemCode(url) {
  // もしもAFからRakuten URLを取り出す
  let targetUrl = url;
  if (/moshimo\.com/.test(url)) {
    const match = url.match(/url=([^&]+)/);
    if (match) targetUrl = decodeURIComponent(match[1]);
  }
  // item.rakuten.co.jp/shopcode/itemcode/
  const m = targetUrl.match(/item\.rakuten\.co\.jp\/([^\/]+)\/([^\/\?]+)/);
  if (m) return { shopCode: m[1], itemCode: m[2] };
  return null;
}

function extractAsin(url) {
  const m = url.match(/\/dp\/([A-Z0-9]{10})/);
  return m ? m[1] : null;
}

async function handleFetch() {
  const url = document.getElementById('urlInput').value.trim();
  const status = document.getElementById('fetchStatus');
  const btn = document.getElementById('fetchBtn');
  if (!url) { showStatus(status, 'URLを入力してください', 'err'); return; }

  const shop = detectShop(url);
  if (!shop) { showStatus(status, 'Amazon・楽天・Creema・minneのURLを入力してください', 'err'); return; }

  // ショップ設定
  document.getElementById('f_shop').value = shop;
  updateShopBadge(shop);

  // アフィリエイトURLをセット
  document.getElementById('f_url').value = url;

  if (shop === '楽天') {
    const itemInfo = extractRakutenItemCode(url);
    if (itemInfo) {
      btn.innerHTML = '<span class="spinner"></span>取得中...';
      btn.disabled = true;
      try {
        await fetchRakutenItem(itemInfo.shopCode, itemInfo.itemCode);
        showStatus(status, '楽天商品情報を自動取得しました ✓', 'ok');
      } catch(e) {
        showStatus(status, `楽天API未応答（${e.message}）。手動で入力してください。`, 'info');
      }
      btn.innerHTML = '情報取得';
      btn.disabled = false;
    }
  } else if (shop === 'Amazon') {
    const asin = extractAsin(url);
    if (asin) {
      document.getElementById('f_image').value = `https://m.media-amazon.com/images/I/`;
      showStatus(status, `Amazon ASIN: ${asin}。画像URLと商品情報を手動で入力してください。`, 'info');
    }
  } else {
    showStatus(status, `${shop}のURLを検出。商品情報を手動で入力してください。`, 'info');
  }
}

async function fetchRakutenItem(shopCode, itemCode) {
  const params = new URLSearchParams({
    applicationId: RAKUTEN_APP_ID,
    shopCode,
    itemCode,
    format: 'json',
    formatVersion: '2'
  });
  const res = await fetch(`https://app.rakuten.co.jp/services/api/IchibaItem/Search/20170706?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.Items || data.Items.length === 0) throw new Error('商品が見つかりません');

  const item = data.Items[0];
  document.getElementById('f_name').value = item.itemName.substring(0, 60);
  document.getElementById('f_price').value = item.itemPrice;
  document.getElementById('f_rating').value = item.reviewAverage || '';
  document.getElementById('f_reviewCount').value = item.reviewCount || '';
  const img = (item.mediumImageUrls[0] || '').replace('?_ex=128x128', '?_ex=400x400');
  document.getElementById('f_image').value = img;
  previewImg(img);

  // スタイル・タイプ自動推定
  const name = item.itemName;
  document.getElementById('f_style').value = guessStyle(name);
  document.getElementById('f_type').value = guessType(name);
  document.getElementById('f_delivery').value = '〜3日';
  document.getElementById('f_tags').value = extractTags(name).join(', ');
}

// =====================
// スタイル・タイプ推定
// =====================
function guessStyle(name) {
  if (/和風|毛筆|書道|書家|色紙|和紙/.test(name)) return '和風';
  if (/シンプル|スタイリッシュ|モダン/.test(name)) return 'モダン';
  if (/木製|ウッド|刺繍|ファブリック|布/.test(name)) return 'ナチュラル';
  return '洋風';
}
function guessType(name) {
  if (/手書き|手描き|毛筆|書道|書家|代筆/.test(name)) return '手書き';
  if (/データ|ダウンロード|デジタル|PDF/.test(name)) return 'デジタル';
  return '印刷';
}
function extractTags(name) {
  const tagMap = [
    ['手形','手形'],['足形','足形'],['写真','写真入り'],['額縁','額縁付き'],
    ['フレーム','フレーム付き'],['木製','木製'],['刺繍','刺繍'],
    ['送料無料','送料無料'],['ディズニー','ディズニー'],['手書き','手書き'],
    ['代筆','代筆'],['ローマ字','ローマ字付き'],['キャンバス','キャンバス'],
    ['ラミネート','ラミネート'],['名入れ','名入れ'],['お七夜','お七夜'],
  ];
  return tagMap.filter(([k]) => name.includes(k)).map(([,v]) => v).slice(0, 2);
}

// =====================
// 商品追加
// =====================
function addProduct() {
  const status = document.getElementById('addStatus');
  const name  = document.getElementById('f_name').value.trim();
  const price = parseInt(document.getElementById('f_price').value);
  const url   = document.getElementById('f_url').value.trim();

  if (!name) { showStatus(status, '商品名を入力してください', 'err'); return; }
  if (!price || price <= 0) { showStatus(status, '価格を入力してください', 'err'); return; }
  if (!url)  { showStatus(status, 'アフィリエイトURLを入力してください', 'err'); return; }

  const products = loadProducts();
  const newProduct = {
    id: Date.now(),
    name,
    price,
    shop:        document.getElementById('f_shop').value,
    style:       document.getElementById('f_style').value,
    type:        document.getElementById('f_type').value,
    rating:      parseFloat(document.getElementById('f_rating').value) || 0,
    reviewCount: parseInt(document.getElementById('f_reviewCount').value) || 0,
    delivery:    document.getElementById('f_delivery').value || '〜7日',
    tags:        document.getElementById('f_tags').value.split(',').map(t => t.trim()).filter(Boolean).slice(0, 2),
    image:       document.getElementById('f_image').value.trim(),
    url,
    isNew:       false,
    addedAt:     new Date().toISOString()
  };
  if (newProduct.tags.length === 0) newProduct.tags = ['命名書'];

  products.push(newProduct);
  saveProducts(products);
  renderList();
  clearForm();
  showStatus(status, `「${name.substring(0, 20)}…」を追加しました ✓`, 'ok');
}

// =====================
// フォーム操作
// =====================
function clearForm() {
  ['f_name','f_price','f_rating','f_reviewCount','f_delivery','f_tags','f_image','f_url','urlInput']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('f_shop').value = '楽天';
  document.getElementById('f_style').value = '洋風';
  document.getElementById('f_type').value = '印刷';
  document.getElementById('imgThumb').src = '';
  document.getElementById('shopBadge').innerHTML = '';
  document.getElementById('fetchStatus').style.display = 'none';
  document.getElementById('addStatus').style.display = 'none';
}

function previewImg(src) {
  document.getElementById('imgThumb').src = src || '';
}

function updateShopBadge(shop) {
  const classMap = { '楽天': 'badge-rakuten', 'Amazon': 'badge-amazon', 'Creema': 'badge-creema', 'minne': 'badge-minne' };
  const cls = classMap[shop] || 'badge-unknown';
  document.getElementById('shopBadge').innerHTML = `<span class="shop-badge ${cls}">${shop}</span>`;
}

function showStatus(el, msg, type) {
  el.textContent = msg;
  el.className = `status ${type}`;
}

// =====================
// localStorage 操作
// =====================
function loadProducts() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveProducts(products) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
}

function deleteProduct(id) {
  const products = loadProducts().filter(p => p.id !== id);
  saveProducts(products);
  renderList();
}

// =====================
// リスト描画
// =====================
function renderList() {
  const products = loadProducts();
  const list = document.getElementById('productList');
  document.getElementById('manualCount').textContent = `（${products.length}件）`;

  if (products.length === 0) {
    list.innerHTML = '<div class="empty-list">まだ手動追加した商品はありません</div>';
    return;
  }

  list.innerHTML = products.slice().reverse().map(p => `
    <div class="product-item">
      <img src="${p.image || ''}" alt="${p.name}" onerror="this.onerror=null;this.src=''">
      <div class="product-item-info">
        <div class="product-item-name">${p.name}</div>
        <div class="product-item-meta">
          ¥${p.price.toLocaleString()} ／ ${p.shop} ／ ${p.style} ／ ${p.type}
          ${ p.reviewCount ? ` ／ ★${p.rating}（${p.reviewCount}件）` : '' }
        </div>
      </div>
      <button class="btn btn-danger" onclick="deleteProduct(${p.id})">削除</button>
    </div>
  `).join('');
}

// =====================
// Enter キーで取得
// =====================
document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleFetch();
});

// 初期描画
renderList();
</script>
</body>
</html>
