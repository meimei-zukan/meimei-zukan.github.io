<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命名書ずかん｜商品管理</title>
<style>
:root {
  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --border: #EDE9E3;
  --text: #2C2825;
  --muted: #8A8078;
  --accent: #C9A882;
  --accent-light: #F5EDE3;
  --accent-dark: #A8895F;
  --green: #5BA362;
  --red: #D86B6B;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1400px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--surface); border-radius: var(--radius); margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
h1 { font-size: 18px; color: var(--accent-dark); }
.btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-success { background: var(--green); color: white; }
.btn-danger { background: var(--red); color: white; }
.btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent-dark); }
.btn-sm { padding: 5px 10px; font-size: 11px; }

.layout { display: grid; grid-template-columns: 480px 1fr; gap: 20px; }
@media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
.panel h2 { font-size: 14px; margin-bottom: 16px; color: var(--accent-dark); display: flex; justify-content: space-between; align-items: center; }
.panel-stats { font-size: 11px; color: var(--muted); font-weight: normal; }

.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none;
  background: var(--surface);
}
.form-row input:focus, .form-row select:focus { border-color: var(--accent); }
.form-row textarea { resize: vertical; min-height: 60px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.dropzone {
  border: 2px dashed var(--border); border-radius: 12px; padding: 30px 20px; text-align: center;
  cursor: pointer; transition: all 0.2s; background: var(--accent-light); color: var(--accent-dark);
  font-size: 12px; line-height: 1.6;
}
.dropzone.dragover { border-color: var(--accent); background: #F0E5D0; }
.dropzone strong { font-size: 13px; }
.dropzone img { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 10px; }

.shop-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-right: 6px; }
.shop-amazon { background: #FFE6CC; color: #B8530E; }
.shop-rakuten { background: #FCDADA; color: #BB3030; }
.shop-yahoo { background: #E0E8FF; color: #4040AA; }

.message { padding: 10px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
.message-error { background: #FFE5E5; color: var(--red); }
.message-success { background: #E5F5E5; color: var(--green); }

.product-list { max-height: 75vh; overflow-y: auto; padding-right: 4px; }
.product-item {
  display: flex; gap: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 8px; background: var(--surface);
}
.product-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; background: var(--accent-light); }
.product-item-body { flex: 1; min-width: 0; }
.product-item-name { font-size: 12px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.product-item-meta { font-size: 10px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.product-item-actions { display: flex; gap: 4px; align-items: center; }

.filter-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-chip {
  padding: 4px 10px; border: 1.5px solid var(--border); border-radius: 16px; cursor: pointer;
  font-size: 11px; color: var(--muted); background: var(--bg);
}
.filter-chip.active { background: var(--accent); border-color: var(--accent); color: white; }

.tag-input-wrap { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px; border: 1.5px solid var(--border); border-radius: 8px; }
.tag-chip { background: var(--accent-light); color: var(--accent-dark); padding: 3px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; }
.tag-chip:hover { background: var(--accent); color: white; }
.tag-input-wrap input { flex: 1; min-width: 100px; border: none !important; outline: none; padding: 4px 6px !important; }

.preview-section { background: var(--accent-light); padding: 12px; border-radius: 8px; margin-top: 12px; }
.preview-section h3 { font-size: 12px; color: var(--accent-dark); margin-bottom: 8px; }

.help { font-size: 11px; color: var(--muted); line-height: 1.6; background: #FFF8E7; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
.help code { background: var(--surface); padding: 1px 5px; border-radius: 3px; font-size: 10px; }

.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
</style>
</head>
<body>

<header>
  <h1>📝 命名書ずかん 商品管理</h1>
  <div style="display:flex; gap:8px;">
    <button class="btn btn-ghost" onclick="loadFromServer()">🔄 読み込み</button>
    <input type="file" id="fileLoad" accept=".json" style="display:none" onchange="loadFromFile(event)">
    <button class="btn btn-ghost" onclick="document.getElementById('fileLoad').click()">📂 JSONファイル読込</button>
    <button class="btn btn-success" onclick="exportJson()">💾 products.json ダウンロード</button>
  </div>
</header>

<div id="message"></div>

<div class="layout">
  <!-- 左：追加フォーム -->
  <div class="panel">
    <h2>新規商品を追加 <span class="panel-stats" id="formStats"></span></h2>

    <div class="help">
      💡 <strong>使い方：</strong>商品ページのURLを貼り付け→画像をドラッグ→カテゴリー選択→「追加」<br>
      アフィリエイトURL変換も自動。
    </div>

    <div class="form-row">
      <label>商品ページのURL（Amazon / 楽天 / Yahoo）</label>
      <input type="text" id="rawUrl" placeholder="https://www.amazon.co.jp/dp/B07... または item.rakuten.co.jp/..." oninput="parseUrl()">
      <div id="urlInfo" style="font-size:11px; color:var(--muted); margin-top:4px;"></div>
    </div>

    <div class="form-row">
      <label>商品名</label>
      <input type="text" id="name" placeholder="例：whipwhip 命名書 書道家アーティスト監修 シンプル">
    </div>

    <div class="form-grid-3">
      <div class="form-row">
        <label>価格（円）</label>
        <input type="number" id="price" placeholder="1680">
      </div>
      <div class="form-row">
        <label>評価（★）</label>
        <input type="number" id="rating" step="0.1" min="0" max="5" placeholder="4.7">
      </div>
      <div class="form-row">
        <label>レビュー数</label>
        <input type="number" id="reviewCount" placeholder="300">
      </div>
    </div>

    <div class="form-row">
      <label>カテゴリー（命名書＋○○）</label>
      <select id="category">
        <option value="用紙のみ">用紙のみ（自分で書くタイプ）</option>
        <option value="代筆">代筆（書道家・刺繍代筆）</option>
        <option value="＋手形足形">＋手形足形</option>
        <option value="＋写真">＋写真</option>
        <option value="＋フレーム">＋フレーム（額付き）</option>
        <option value="＋アルバム">＋アルバム</option>
        <option value="＋木製">＋木製（木札・木製プレート）</option>
      </select>
    </div>

    <div class="form-grid">
      <div class="form-row">
        <label>スタイル</label>
        <select id="style">
          <option value="モダン">モダン</option>
          <option value="和風">和風</option>
          <option value="洋風">洋風</option>
          <option value="ナチュラル">ナチュラル</option>
        </select>
      </div>
      <div class="form-row">
        <label>形式</label>
        <select id="type">
          <option value="印刷">印刷</option>
          <option value="手書き">手書き（代筆）</option>
          <option value="デジタル">デジタル</option>
        </select>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-row">
        <label>納期</label>
        <input type="text" id="delivery" placeholder="〜3日 / 翌日〜2日 など" value="〜5日">
      </div>
      <div class="form-row">
        <label>新着 (isNew)</label>
        <select id="isNew">
          <option value="false">いいえ</option>
          <option value="true">はい</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label>タグ（カンマ区切り、最大3件）</label>
      <input type="text" id="tags" placeholder="例：手書き, 額縁付き, 送料無料">
    </div>

    <div class="form-row">
      <label>商品画像（ドラッグ&ドロップ / Ctrl+V / URL貼り付け）</label>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('imgInput').click()">
        <strong>📷 ここに画像をドラッグ</strong><br>
        または Ctrl+V で貼り付け、クリックでファイル選択<br>
        <small>※ 自動で400×400にリサイズ＆圧縮されます</small>
        <div id="imgPreview"></div>
      </div>
      <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImageFile(event.target.files[0])">
      <input type="text" id="imgUrl" placeholder="または画像URLを貼り付け" style="margin-top:6px;" oninput="setImageFromUrl(this.value)">
    </div>

    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="btn btn-primary" style="flex:1;" onclick="addProduct()">➕ 追加</button>
      <button class="btn btn-ghost" onclick="clearForm()">🗑️ クリア</button>
    </div>

    <div id="editingBanner" style="display:none; background:#FFF3CD; color:#856404; padding:8px 12px; border-radius:6px; margin-top:10px; font-size:12px;">
      ✏️ 編集中 ID:<span id="editingId"></span> ｜ <a href="#" onclick="cancelEdit();return false;" style="color:var(--red);">キャンセル</a>
    </div>
  </div>

  <!-- 右：商品一覧 -->
  <div class="panel">
    <h2>登録済み商品 <span class="panel-stats" id="listStats">0件</span></h2>

    <div class="filter-bar" id="categoryFilter">
      <span class="filter-chip active" data-cat="all">すべて</span>
      <span class="filter-chip" data-cat="用紙のみ">用紙のみ</span>
      <span class="filter-chip" data-cat="代筆">代筆</span>
      <span class="filter-chip" data-cat="＋手形足形">＋手形足形</span>
      <span class="filter-chip" data-cat="＋写真">＋写真</span>
      <span class="filter-chip" data-cat="＋フレーム">＋フレーム</span>
      <span class="filter-chip" data-cat="＋アルバム">＋アルバム</span>
      <span class="filter-chip" data-cat="＋木製">＋木製</span>
    </div>

    <div class="filter-bar">
      <span class="filter-chip active" data-shop="all">すべて</span>
      <span class="filter-chip" data-shop="Amazon">Amazon</span>
      <span class="filter-chip" data-shop="楽天">楽天</span>
      <span class="filter-chip" data-shop="Yahoo">Yahoo</span>
    </div>

    <div class="product-list" id="productList"></div>
  </div>
</div>

<script>
// ===== 状態管理 =====
const STORAGE_KEY = 'meimei_admin_data_v2';
let state = {
  products: [],
  categories: [],
  affiliateConfig: {
    amazon: { tag: 'art0e3-22' },
    rakuten: { affiliateId: '539c41fd.15d3f407.539c41fe.fae19085' },
    yahoo: { sid: '3576687', pid: '2025875' }
  },
  filterCategory: 'all',
  filterShop: 'all',
  editingId: null,
  currentImage: ''
};

// ===== URL解析 =====
function parseUrl() {
  const url = document.getElementById('rawUrl').value.trim();
  const info = document.getElementById('urlInfo');
  if (!url) { info.innerHTML = ''; return null; }

  // Amazon
  const amazonMatch = url.match(/amazon\.co\.jp\/(?:[^\/]+\/)?(?:dp|gp\/product)\/([A-Z0-9]{10})/);
  if (amazonMatch) {
    const asin = amazonMatch[1];
    info.innerHTML = `<span class="shop-badge shop-amazon">Amazon</span> ASIN: ${asin}`;
    return { shop: 'Amazon', asin };
  }

  // Rakuten
  const rakutenMatch = url.match(/item\.rakuten\.co\.jp\/([^\/]+)\/([^\/\?]+)/);
  if (rakutenMatch) {
    info.innerHTML = `<span class="shop-badge shop-rakuten">楽天</span> ${rakutenMatch[1]}/${rakutenMatch[2]}`;
    return { shop: '楽天', shopCode: rakutenMatch[1], itemCode: rakutenMatch[2], itemUrl: `https://item.rakuten.co.jp/${rakutenMatch[1]}/${rakutenMatch[2]}/` };
  }

  // Yahoo Shopping
  const yahooMatch = url.match(/store\.shopping\.yahoo\.co\.jp\/([^\/]+)\/([^\/\?]+)/);
  if (yahooMatch) {
    info.innerHTML = `<span class="shop-badge shop-yahoo">Yahoo</span> ${yahooMatch[1]}/${yahooMatch[2]}`;
    return { shop: 'Yahoo', shopCode: yahooMatch[1], itemCode: yahooMatch[2], itemUrl: url };
  }

  info.innerHTML = '<span style="color:var(--red);">⚠️ Amazon / 楽天 / Yahoo のURLを貼り付けてください</span>';
  return null;
}

function buildAffiliateUrl(parsed) {
  if (!parsed) return '';
  if (parsed.shop === 'Amazon') {
    return `https://www.amazon.co.jp/dp/${parsed.asin}?tag=${state.affiliateConfig.amazon.tag}`;
  }
  if (parsed.shop === '楽天') {
    return `https://hb.afl.rakuten.co.jp/ichiba/${state.affiliateConfig.rakuten.affiliateId}/?pc=${encodeURIComponent(parsed.itemUrl)}`;
  }
  if (parsed.shop === 'Yahoo') {
    const y = state.affiliateConfig.yahoo;
    return `https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=${y.sid}&pid=${y.pid}&vc_url=${encodeURIComponent(parsed.itemUrl)}`;
  }
  return '';
}

// ===== 画像処理 =====
const dropzone = document.getElementById('dropzone');
['dragover','dragenter'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) handleImageFile(file);
  else if (e.dataTransfer.getData('text/uri-list')) setImageFromUrl(e.dataTransfer.getData('text/uri-list'));
  else if (e.dataTransfer.getData('text/html')) {
    const html = e.dataTransfer.getData('text/html');
    const m = html.match(/src="([^"]+)"/);
    if (m) setImageFromUrl(m[1]);
  }
});

// Ctrl+V でクリップボード画像
document.addEventListener('paste', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text' && e.target.id !== 'imgUrl') return;
  const items = e.clipboardData.items;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      handleImageFile(item.getAsFile());
      e.preventDefault();
      return;
    }
  }
});

function handleImageFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    compressImage(e.target.result, (compressed) => {
      state.currentImage = compressed;
      showImagePreview(compressed);
    });
  };
  reader.readAsDataURL(file);
}

function setImageFromUrl(url) {
  if (!url || !url.match(/^https?:\/\//)) return;
  // 外部URLはそのまま保存（Amazon・楽天の画像URLはそのまま使う）
  state.currentImage = url;
  showImagePreview(url);
}

function compressImage(dataUrl, callback) {
  const img = new Image();
  img.onload = () => {
    const size = 400;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    // 中心クロップ
    const ratio = Math.max(size / img.width, size / img.height);
    const sw = size / ratio;
    const sh = size / ratio;
    const sx = (img.width - sw) / 2;
    const sy = (img.height - sh) / 2;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, size, size);
    callback(canvas.toDataURL('image/jpeg', 0.75));
  };
  img.crossOrigin = 'anonymous';
  img.onerror = () => { state.currentImage = dataUrl; showImagePreview(dataUrl); };
  img.src = dataUrl;
}

function showImagePreview(src) {
  document.getElementById('imgPreview').innerHTML = `<img src="${src}" alt="preview">`;
}

// ===== タグ処理 =====
function parseTags(str) {
  return str.split(/[,、]/).map(s => s.trim()).filter(s => s).slice(0, 3);
}

// ===== 商品追加・編集 =====
function clearForm() {
  document.getElementById('rawUrl').value = '';
  document.getElementById('name').value = '';
  document.getElementById('price').value = '';
  document.getElementById('rating').value = '';
  document.getElementById('reviewCount').value = '';
  document.getElementById('category').value = '用紙のみ';
  document.getElementById('style').value = 'モダン';
  document.getElementById('type').value = '印刷';
  document.getElementById('delivery').value = '〜5日';
  document.getElementById('isNew').value = 'false';
  document.getElementById('tags').value = '';
  document.getElementById('imgUrl').value = '';
  document.getElementById('imgPreview').innerHTML = '';
  document.getElementById('urlInfo').innerHTML = '';
  state.currentImage = '';
  state.editingId = null;
  document.getElementById('editingBanner').style.display = 'none';
}

function cancelEdit() { clearForm(); }

function addProduct() {
  const parsed = parseUrl();
  const name = document.getElementById('name').value.trim();
  if (!name) return showMsg('商品名を入力してください', 'error');
  if (!parsed) return showMsg('有効なURL（Amazon/楽天/Yahoo）を貼り付けてください', 'error');
  if (!state.currentImage) return showMsg('画像をドラッグするかURLを貼り付けてください', 'error');

  const product = {
    id: state.editingId || nextId(),
    name,
    category: document.getElementById('category').value,
    price: parseInt(document.getElementById('price').value) || 0,
    style: document.getElementById('style').value,
    type: document.getElementById('type').value,
    shop: parsed.shop,
    rating: parseFloat(document.getElementById('rating').value) || 0,
    reviewCount: parseInt(document.getElementById('reviewCount').value) || 0,
    delivery: document.getElementById('delivery').value || '〜5日',
    tags: parseTags(document.getElementById('tags').value),
    image: state.currentImage,
    url: buildAffiliateUrl(parsed),
    isNew: document.getElementById('isNew').value === 'true'
  };

  if (state.editingId) {
    const idx = state.products.findIndex(p => p.id === state.editingId);
    state.products[idx] = product;
    showMsg(`「${name}」を更新しました`, 'success');
  } else {
    state.products.push(product);
    showMsg(`「${name}」を追加しました（計${state.products.length}件）`, 'success');
  }

  saveLocal();
  renderList();
  clearForm();
}

function editProduct(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  state.editingId = id;
  // URLを逆引きするのは難しいので、編集モードではURL欄に「アフィリエイトURL」を表示
  document.getElementById('rawUrl').value = p.url;
  parseUrl();
  document.getElementById('name').value = p.name;
  document.getElementById('price').value = p.price;
  document.getElementById('rating').value = p.rating;
  document.getElementById('reviewCount').value = p.reviewCount;
  document.getElementById('category').value = p.category;
  document.getElementById('style').value = p.style;
  document.getElementById('type').value = p.type;
  document.getElementById('delivery').value = p.delivery;
  document.getElementById('isNew').value = p.isNew ? 'true' : 'false';
  document.getElementById('tags').value = p.tags.join(', ');
  state.currentImage = p.image;
  showImagePreview(p.image);
  document.getElementById('editingId').textContent = id;
  document.getElementById('editingBanner').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteProduct(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`「${p.name}」を削除しますか？`)) return;
  state.products = state.products.filter(x => x.id !== id);
  saveLocal();
  renderList();
  showMsg(`削除しました`, 'success');
}

function nextId() {
  if (state.products.length === 0) return 1;
  return Math.max(...state.products.map(p => p.id)) + 1;
}

// ===== 一覧表示 =====
document.querySelectorAll('[data-cat]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('[data-cat]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filterCategory = chip.dataset.cat;
    renderList();
  });
});
document.querySelectorAll('[data-shop]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('[data-shop]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filterShop = chip.dataset.shop;
    renderList();
  });
});

function renderList() {
  const list = document.getElementById('productList');
  let filtered = state.products;
  if (state.filterCategory !== 'all') filtered = filtered.filter(p => p.category === state.filterCategory);
  if (state.filterShop !== 'all') filtered = filtered.filter(p => p.shop === state.filterShop);

  document.getElementById('listStats').textContent = `${filtered.length} / ${state.products.length}件`;

  if (filtered.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted); font-size:12px;">該当する商品がありません</div>`;
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="product-item">
      <img src="${p.image}" alt="" onerror="this.src='https://placehold.co/60x60/F5EDE3/A8895F?text=?'">
      <div class="product-item-body">
        <div class="product-item-name">${p.name}</div>
        <div class="product-item-meta">
          <span class="shop-badge shop-${p.shop === 'Amazon' ? 'amazon' : p.shop === '楽天' ? 'rakuten' : 'yahoo'}">${p.shop}</span>
          <span>📂 ${p.category}</span>
          <span>¥${p.price.toLocaleString()}</span>
          <span>★${p.rating} (${p.reviewCount})</span>
        </div>
      </div>
      <div class="product-item-actions">
        <button class="btn btn-ghost btn-sm" onclick="editProduct(${p.id})">編集</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">削除</button>
      </div>
    </div>
  `).join('');
}

// ===== 保存・読み込み =====
function saveLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    products: state.products,
    categories: state.categories,
    affiliateConfig: state.affiliateConfig
  }));
}

function loadLocal() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data) {
      state.products = data.products || [];
      if (data.categories) state.categories = data.categories;
      if (data.affiliateConfig) state.affiliateConfig = data.affiliateConfig;
      return true;
    }
  } catch {}
  return false;
}

async function loadFromServer() {
  try {
    const res = await fetch('products.json?v=' + Date.now());
    const data = await res.json();
    state.products = data.products || [];
    if (data.categories) state.categories = data.categories;
    if (data.affiliateConfig) state.affiliateConfig = data.affiliateConfig;
    saveLocal();
    renderList();
    showMsg(`products.json から ${state.products.length}件 を読み込みました`, 'success');
  } catch (e) {
    showMsg('products.jsonの読み込みに失敗: ' + e.message, 'error');
  }
}

function loadFromFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      state.products = data.products || [];
      if (data.categories) state.categories = data.categories;
      if (data.affiliateConfig) state.affiliateConfig = data.affiliateConfig;
      saveLocal();
      renderList();
      showMsg(`${file.name} から ${state.products.length}件 を読み込みました`, 'success');
    } catch (err) {
      showMsg('JSONパースエラー: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function exportJson() {
  const data = {
    "$schema": "category enum: 用紙のみ | 代筆 | ＋手形足形 | ＋写真 | ＋フレーム | ＋アルバム | ＋木製",
    categories: state.categories.length > 0 ? state.categories : [
      { key: "用紙のみ", label: "用紙のみ", description: "自分で書くタイプ" },
      { key: "代筆", label: "代筆", description: "書道家・刺繍代筆" },
      { key: "＋手形足形", label: "＋手形足形", description: "手形足形が残せる" },
      { key: "＋写真", label: "＋写真", description: "写真が入る" },
      { key: "＋フレーム", label: "＋フレーム", description: "額付き" },
      { key: "＋アルバム", label: "＋アルバム", description: "アルバム型" },
      { key: "＋木製", label: "＋木製", description: "木札・木製プレート" }
    ],
    lastUpdated: new Date().toISOString().slice(0, 10),
    affiliateConfig: state.affiliateConfig,
    products: state.products
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'products.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showMsg(`products.json (${state.products.length}件) をダウンロードしました。GitHubにアップロードしてください。`, 'success');
}

// ===== UI helpers =====
function showMsg(text, type) {
  const m = document.getElementById('message');
  m.innerHTML = `<div class="message message-${type}">${text}</div>`;
  setTimeout(() => m.innerHTML = '', 4000);
}

// ===== 初期化 =====
async function init() {
  // まずローカル、なければサーバーから
  if (!loadLocal()) {
    await loadFromServer();
  } else {
    renderList();
    showMsg(`ローカル保存から ${state.products.length}件 を復元しました（最新を反映するには「読み込み」を押してください）`, 'success');
  }
}

init();
</script>
