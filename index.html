<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>命名書ずかん｜手書き・和風・洋風・納期で選べる命名書まとめ</title>
  <style>
    :root {
      --bg: #FAFAF7;
      --surface: #FFFFFF;
      --border: #EDE9E3;
      --text-primary: #2C2825;
      --text-secondary: #8A8078;
      --accent: #C9A882;
      --accent-light: #F5EDE3;
      --accent-dark: #A8895F;
      --pink: #E8D5CC;
      --pink-light: #FDF6F3;
      --shadow-sm: 0 1px 4px rgba(44,40,37,0.06);
      --shadow-md: 0 4px 16px rgba(44,40,37,0.10);
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
    }

    .logo-text {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.05em;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .count-badge {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .count-badge span {
      font-weight: 700;
      color: var(--accent-dark);
    }

    /* ヒーロー */
    .hero {
      background-image: linear-gradient(90deg, rgba(253,246,243,0.92) 0%, rgba(253,246,243,0.55) 38%, rgba(253,246,243,0) 60%), url('hero.png');
      background-size: cover;
      background-position: right center;
      background-repeat: no-repeat;
      padding: 72px 24px 72px 48px;
      min-height: 320px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .hero-img-mobile { display: none; }

    .hero h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      color: var(--text-primary);
      line-height: 1.5;
      text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    }

    .hero p {
      font-size: 14px;
      color: #5C4A3A;
      line-height: 1.9;
      max-width: 480px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    }

    .hero-tags {
      display: flex;
      gap: 8px;
      justify-content: flex-start;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .hero-tag {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* フィルターバー */
    .filter-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      position: sticky;
      top: 60px;
      z-index: 90;
      box-shadow: var(--shadow-sm);
    }

    .filter-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
    }

    .filter-scroll::-webkit-scrollbar { display: none; }

    .filter-label {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      margin-right: 4px;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .filter-btn {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
      background: var(--accent-light);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 600;
    }

    .filter-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ソートバー */
    .sort-bar {
      padding: 14px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .result-count {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .result-count strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .sort-select {
      font-size: 12px;
      color: var(--text-secondary);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      background: var(--surface);
      cursor: pointer;
      font-family: inherit;
      outline: none;
    }

    /* グリッド */
    .grid-container {
      padding: 16px 24px 60px;
    }

    /* カテゴリーセクション（章立て） */
    .category-section {
      margin-bottom: 72px;
      position: relative;
    }

    .category-section + .category-section::before {
      content: '◆ ◆ ◆';
      position: absolute;
      top: -42px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--accent);
      font-size: 10px;
      letter-spacing: 8px;
      opacity: 0.4;
    }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 24px 28px;
      background: linear-gradient(135deg, var(--pink-light) 0%, var(--accent-light) 100%);
      border-radius: var(--radius);
      border-left: 6px solid var(--accent);
      margin-bottom: 28px;
      position: relative;
      box-shadow: 0 3px 14px rgba(44,40,37,0.08);
      overflow: hidden;
    }

    .cat-header::after {
      content: '';
      position: absolute;
      right: -20px;
      top: -20px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(201,168,130,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .cat-icon-circle {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border-radius: 50%;
      font-size: 32px;
      box-shadow: 0 3px 10px rgba(44,40,37,0.12);
      flex-shrink: 0;
      border: 2px solid white;
      z-index: 2;
    }

    .cat-text {
      flex: 1;
      min-width: 0;
      z-index: 2;
    }

    .cat-tagline {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.06em;
      line-height: 1.4;
      margin-bottom: 6px;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    }

    .cat-header h2 {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .cat-name-label {
      display: inline-block;
      color: var(--accent-dark);
      background: rgba(255,255,255,0.65);
      border: 1px solid var(--accent);
      padding: 3px 10px;
      border-radius: 12px;
    }

    .cat-header p {
      font-size: 13px;
      color: #6B5D52;
      margin: 0;
      font-weight: 400;
      letter-spacing: 0.03em;
      line-height: 1.7;
    }

    .cat-count {
      background: var(--accent);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(168,137,95,0.35);
      letter-spacing: 0.04em;
      z-index: 2;
    }

    @media (max-width: 600px) {
      .cat-header { padding: 18px 16px; gap: 14px; }
      .cat-icon-circle { width: 48px; height: 48px; font-size: 24px; }
      .cat-tagline { font-size: 16px; letter-spacing: 0.04em; }
      .cat-header h2 { font-size: 10px; letter-spacing: 0.15em; }
      .cat-name-label { padding: 2px 8px; }
      .cat-header p { font-size: 11px; }
      .cat-count { padding: 5px 11px; font-size: 11px; }
      .category-section { margin-bottom: 56px; }
      .category-section + .category-section::before { top: -32px; }
    }

    /* ランキング（トップ3） */
    .podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 28px;
    }

    .podium-item {
      position: relative;
    }

    .podium-item .product-card {
      border-width: 2.5px;
      box-shadow: 0 4px 20px rgba(44,40,37,0.12);
    }

    .podium-item.rank-1 .product-card { border-color: #E5B83C; }
    .podium-item.rank-2 .product-card { border-color: #B8B8B8; }
    .podium-item.rank-3 .product-card { border-color: #C28250; }

    .rank-badge {
      position: absolute;
      top: -10px;
      left: 14px;
      background: var(--surface);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      z-index: 5;
      box-shadow: 0 2px 8px rgba(44,40,37,0.15);
    }

    .rank-1 .rank-badge { background: linear-gradient(135deg, #FFD700, #E5B83C); color: #5C3D00; }
    .rank-2 .rank-badge { background: linear-gradient(135deg, #E8E8E8, #B8B8B8); color: #404040; }
    .rank-3 .rank-badge { background: linear-gradient(135deg, #E8A876, #C28250); color: #5C3010; }

    .rest-header {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
      margin: 16px 0 12px;
      padding-left: 4px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .product-grid.rest-grid {
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
    }

    @media (max-width: 1200px) {
      .product-grid.rest-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 900px) {
      .product-grid.rest-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* 商品カード */
    .product-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .card-image-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--accent-light);
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .product-card:hover .card-image-wrap img {
      transform: scale(1.04);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.92);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-dark);
      backdrop-filter: blur(4px);
    }

    .card-badge.new {
      background: var(--accent);
      color: white;
    }

    .card-shop {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.88);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 9px;
      color: var(--text-secondary);
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .card-tag {
      background: var(--accent-light);
      color: var(--accent-dark);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-stars {
      color: #E8B84B;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .card-rating {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .card-delivery {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: auto;
    }

    .card-delivery span {
      color: #6BAA75;
      font-weight: 600;
    }

    .card-footer {
      padding: 0 14px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-price {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .card-price sup {
      font-size: 11px;
      font-weight: 400;
    }

    .card-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
      text-decoration: none;
      display: inline-block;
    }

    .card-btn:hover { opacity: 0.88; }

    /* 空状態 */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-secondary);
      display: none;
    }

    .empty-state p { font-size: 15px; margin-top: 12px; }

    /* フッター */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 2;
    }

    /* レスポンシブ */
    @media (max-width: 600px) {
      .hero {
        background-image: none;
        background-color: var(--pink-light);
        padding: 0 0 24px;
        min-height: 0;
        text-align: center;
        align-items: stretch;
      }
      .hero-img-mobile {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
      }
      .hero-text { padding: 16px 16px 0; width: 100%; }
      .hero p { max-width: 100%; }
      .hero-tags { justify-content: center; }
      .hero h1 { font-size: 18px; }
      .grid-container { padding: 12px 12px 60px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .product-grid.rest-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .podium { grid-template-columns: 1fr; gap: 24px; }
      .cat-header h2 { font-size: 18px; }
      .cat-header p { font-size: 11px; }
      .filter-bar { padding: 12px 16px; }
      .sort-bar { padding: 12px 16px 0; }
    }
  </style>
</head>
<body>

<!-- ヘッダー -->
<header>
  <a class="logo" href="#">
    <div class="logo-mark">命</div>
    <div>
      <div class="logo-text">命名書ずかん</div>
      <div class="logo-sub">MEIMEI-SHO ZUKAN</div>
    </div>
  </a>
  <div class="header-right"></div>
</header>

<!-- ヒーロー -->
<div class="hero">
  <img src="hero.png" alt="" class="hero-img-mobile">
  <div class="hero-text">
    <h1>赤ちゃんに贈る、世界にひとつの名前。</h1>
    <p>手書き・和風・洋風・デジタル——スタイルや納期で、ぴったりの一枚を見つけてください。</p>
    <div class="hero-tags">
      <span class="hero-tag">手書き</span>
      <span class="hero-tag">和風・洋風</span>
      <span class="hero-tag">即日対応</span>

      <span class="hero-tag">額縁セット</span>
      <span class="hero-tag">名入れ</span>
    </div>
  </div>
</div>

<!-- フィルターバー -->
<div class="filter-bar">
  <div class="filter-scroll">
    <span class="filter-label">絞り込み</span>

    <div class="filter-group" id="filterCategory">
      <button class="filter-btn active" data-filter="category" data-value="all">種類：すべて</button>
      <button class="filter-btn" data-filter="category" data-value="用紙のみ">用紙のみ</button>
      <button class="filter-btn" data-filter="category" data-value="代筆">代筆</button>
      <button class="filter-btn" data-filter="category" data-value="＋手形足形">＋手形足形</button>

      <button class="filter-btn" data-filter="category" data-value="＋木製">＋木製</button>
    </div>

    <div class="filter-divider"></div>

    <div class="filter-group" id="filterStyle">
      <button class="filter-btn active" data-filter="style" data-value="all">スタイル：すべて</button>
      <button class="filter-btn" data-filter="style" data-value="和風">和風</button>
      <button class="filter-btn" data-filter="style" data-value="洋風">洋風</button>
      <button class="filter-btn" data-filter="style" data-value="モダン">モダン</button>
      <button class="filter-btn" data-filter="style" data-value="ナチュラル">ナチュラル</button>

    <div class="filter-group" id="filterShop">

      <button class="filter-btn" data-filter="shop" data-value="楽天">楽天</button>

  </div>
</div>

<!-- ソートバー -->
<div class="sort-bar">
  <div class="result-count"><strong id="resultCount">0</strong> 件表示中</div>
  <select class="sort-select" id="sortSelect">
    <option value="reviewCount">レビュー数が多い順</option>
    <option value="rating">評価が高い順</option>
    <option value="price_asc">価格が安い順</option>
    <option value="price_desc">価格が高い順</option>
    <option value="new">新着順</option>
  </select>
</div>

<!-- グリッド -->
<div class="grid-container">
  <div id="productGrid"></div>
  <div class="empty-state" id="emptyState">
    <div style="font-size:40px">🔍</div>
    <p>条件に合う商品が見つかりませんでした。<br>絞り込みを変えてみてください。</p>
  </div>
</div>

<footer>
  <div>命名書ずかん｜MEIMEI-SHO ZUKAN</div>
  <div style="font-size:9px; color:#C8C0B8; margin-top:4px;">※当サイトは各種アフィリエイトプログラムにより収益を得ています</div>
  <div style="margin-top:8px; color:#C9A882;">© 2025 命名書ずかん</div>
</footer>

<script>
function moshimoUrl(itemUrl) {
  return `https://af.moshimo.com/af/c/click?a_id=1886762&p_id=54&pc_id=54&pl_id=616&url=${encodeURIComponent(itemUrl)}`;
}


// =====================
// フィルター・ソート状態
// =====================
let products = [];
let filters = { category: "all", style: "all", type: "all", price: "all", shop: "all" };
let sortBy = "reviewCount";


// =====================
// 商品カード生成
// =====================
function renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating % 1 >= 0.5;
  let s = "★".repeat(full);
  if (half) s += "☆";
  return s;
}

function createCard(p) {
  return `
    <div class="product-card" onclick="window.open('${p.url}','_blank')">
      <div class="card-image-wrap">
        <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x400/F5EDE3/A8895F?text=命名書'">
        ${p.isNew ? '<span class="card-badge new">NEW</span>' : `<span class="card-badge">${p.type}</span>`}
        <span class="card-shop">${p.shop}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-tags">
          ${p.tags.slice(0,2).map(t => `<span class="card-tag">${t}</span>`).join("")}
        </div>
        <div class="card-meta">
          <span class="card-stars">${renderStars(p.rating)}</span>
          <span class="card-rating">${p.rating} (${p.reviewCount}件)</span>
        </div>
        <div class="card-delivery">納期：<span>${p.delivery}</span></div>
      </div>
      <div class="card-footer">
        <div class="card-price"><sup>¥</sup>${p.price.toLocaleString()}</div>
        <a class="card-btn" href="${p.url}" target="_blank" onclick="event.stopPropagation()">見る →</a>
      </div>
    </div>
  `;
}

// =====================
// フィルター・ソート適用
// =====================
function getFiltered() {
  return products.filter(p => {
    if (filters.category !== "all" && p.category !== filters.category) return false;
    if (filters.style !== "all" && p.style !== filters.style) return false;
    if (filters.type !== "all" && p.type !== filters.type) return false;
    if (filters.shop !== "all" && p.shop !== filters.shop) return false;
    if (filters.price !== "all") {
      const v = parseInt(filters.price);
      if (v === 3000 && p.price > 3000) return false;
      if (v === 5000 && (p.price <= 3000 || p.price > 5000)) return false;
      if (v === 10000 && (p.price <= 5000 || p.price > 10000)) return false;
      if (v === 10001 && p.price <= 10000) return false;
    }
    return true;
  }).sort((a, b) => {
    if (sortBy === "reviewCount") return b.reviewCount - a.reviewCount;
    if (sortBy === "rating") return b.rating - a.rating;
    if (sortBy === "price_asc") return a.price - b.price;
    if (sortBy === "price_desc") return b.price - a.price;
    if (sortBy === "new") return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0);
    return 0;
  });
}

// カテゴリー定義（表示順）
const CATEGORY_DISPLAY = [
  { key: "代筆",     icon: "✍️", tagline: "書のプロに、託す。",          desc: "書道家・刺繍作家による、世界に一つの一筆を。" },
  { key: "用紙のみ",  icon: "📝", tagline: "自分の手で、はじめての名前を。", desc: "想いを込めて自分で書く、シンプルな命名紙。" },
  { key: "＋手形足形", icon: "👣", tagline: "小さな手と足、今だけの証。",     desc: "今しか残せない小さな手形・足形と一緒に。" },
  { key: "＋写真",    icon: "📷", tagline: "あの日の表情を、名前とともに。", desc: "生まれたての笑顔と命名を、一枚にとじこめて。" },
  { key: "＋フレーム", icon: "🖼️", tagline: "ずっと、飾っていたい。",        desc: "額に入れて、リビングに映える上質な一枚。" },
  { key: "＋アルバム", icon: "📔", tagline: "成長の記録を、一冊の物語に。",   desc: "命名から成長記録まで、まとめて残せるアルバム。" },
  { key: "＋木製",    icon: "🪵", tagline: "やさしい木目に、刻む。",         desc: "ひのきや天然木に名前を刻む、温もりの一品。" }
];

function renderSection(catKey, items) {
  if (items.length === 0) return '';
  const info = CATEGORY_DISPLAY.find(c => c.key === catKey) || { icon: '📦', tagline: '', desc: '' };

  // 並び替えはレビュー数の多い順固定（ランキング用）
  const sorted = [...items].sort((a, b) => b.reviewCount - a.reviewCount);
  const top3 = sorted.slice(0, 3);
  const rest = sorted.slice(3);

  let html = `<section class="category-section">`;
  html += `<div class="cat-header">
    <div class="cat-icon-circle">${info.icon}</div>
    <div class="cat-text">
      <div class="cat-tagline">${info.tagline||''}</div>
      <h2><span class="cat-name-label">${catKey}</span></h2>
      <p>${info.desc}</p>
    </div>
    <div class="cat-count">${items.length}件</div>
  </div>`;

  if (top3.length >= 1) {
    html += `<div class="podium">`;
    top3.forEach((p, i) => {
      const rank = i + 1;
      const labels = ['👑 1位', '🥈 2位', '🥉 3位'];
      html += `<div class="podium-item rank-${rank}">
        <span class="rank-badge">${labels[i]}</span>
        ${createCard(p)}
      </div>`;
    });
    html += `</div>`;
  }

  if (rest.length > 0) {
    html += `<div class="rest-header">そのほか（${rest.length}件）</div>`;
    html += `<div class="product-grid rest-grid">${rest.map(createCard).join('')}</div>`;
  }

  html += `</section>`;
  return html;
}

function render() {
  const filtered = getFiltered();
  const grid = document.getElementById("productGrid");
  const empty = document.getElementById("emptyState");
  document.getElementById("resultCount").textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  // ソートがレビュー数以外（rating/price/new）の場合：フラット表示
  if (sortBy !== 'reviewCount') {
    grid.innerHTML = `<div class="product-grid">${filtered.map(createCard).join("")}</div>`;
    return;
  }

  // カテゴリーフィルターが特定の1つ：そのセクションだけ表示
  if (filters.category !== "all") {
    grid.innerHTML = renderSection(filters.category, filtered);
    return;
  }

  // 全カテゴリー：章立て表示
  const grouped = {};
  for (const p of filtered) {
    if (!grouped[p.category]) grouped[p.category] = [];
    grouped[p.category].push(p);
  }
  grid.innerHTML = CATEGORY_DISPLAY
    .map(c => renderSection(c.key, grouped[c.key] || []))
    .join('');
}

// =====================
// イベント
// =====================
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const filterKey = btn.dataset.filter;
    const value = btn.dataset.value;
    document.querySelectorAll(`[data-filter="${filterKey}"]`).forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filters[filterKey] = value;
    render();
  });
});

document.getElementById("sortSelect").addEventListener("change", e => {
  sortBy = e.target.value;
  render();
});

// =====================
// 初期化
// =====================
function loadManualProducts() {
  try { return JSON.parse(localStorage.getItem('meimei_manual_products')) || []; }
  catch { return []; }
}

async function init() {
  try {
    const res = await fetch('products.json?v=' + Date.now());
    const data = await res.json();
    products = [...(data.products || []), ...loadManualProducts()];
  } catch (e) {
    console.error('products.json読み込みエラー:', e);
    products = loadManualProducts();
  }
  render();
}

init();
</script>
</body>
</html>
